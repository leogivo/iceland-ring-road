<!DOCTYPE html>
<html lang="it">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="Iceland Ring Road · 9 giorni in furgone · Solstizio d'estate 2026">

  <link rel="manifest" href="manifest.json">
